apiVersion: v1
kind: Namespace
metadata:
  name: intellitrack

---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: intellitrack-config
  namespace: intellitrack
data:
  PYTHONUNBUFFERED: "1"
  DEBUG: "false"
  CORS_ORIGINS: "http://localhost:5173,http://frontend:5173"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: intellitrack-secret
  namespace: intellitrack
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-change-in-production"
  DATABASE_URL: "sqlite:///./intellitrack.db"
  DB_PASSWORD: "postgres"

---
# Persistent Volume for database
apiVersion: v1
kind: PersistentVolume
metadata:
  name: intellitrack-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  hostPath:
    path: "/mnt/data/intellitrack"

---
# Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intellitrack-pvc
  namespace: intellitrack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellitrack-backend
  namespace: intellitrack
  labels:
    app: intellitrack
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: intellitrack
      component: backend
  template:
    metadata:
      labels:
        app: intellitrack
        component: backend
    spec:
      containers:
      - name: backend
        image: intellitrack-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: intellitrack-config
        - secretRef:
            name: intellitrack-secret
        livenessProbe:
          httpGet:
            path: /docs
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /docs
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: intellitrack-pvc

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: intellitrack-backend
  namespace: intellitrack
  labels:
    app: intellitrack
    component: backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: intellitrack
    component: backend

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellitrack-frontend
  namespace: intellitrack
  labels:
    app: intellitrack
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: intellitrack
      component: frontend
  template:
    metadata:
      labels:
        app: intellitrack
        component: frontend
    spec:
      containers:
      - name: frontend
        image: intellitrack-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5173
          protocol: TCP
        env:
        - name: VITE_API_URL
          value: "http://intellitrack-backend:8000/api"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: intellitrack-frontend
  namespace: intellitrack
  labels:
    app: intellitrack
    component: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 5173
    targetPort: http
    protocol: TCP
  selector:
    app: intellitrack
    component: frontend

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intellitrack-ingress
  namespace: intellitrack
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - intellitrack.example.com
    secretName: intellitrack-tls
  rules:
  - host: intellitrack.example.com
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: intellitrack-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: intellitrack-frontend
            port:
              number: 5173

---
# Horizontal Pod Autoscaler for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intellitrack-backend-hpa
  namespace: intellitrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intellitrack-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Horizontal Pod Autoscaler for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intellitrack-frontend-hpa
  namespace: intellitrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intellitrack-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intellitrack-network-policy
  namespace: intellitrack
spec:
  podSelector:
    matchLabels:
      app: intellitrack
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: intellitrack
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
