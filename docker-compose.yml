version: '3.9'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intellitrack-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./intellitrack.db}
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://frontend:5173}
    volumes:
      - ./app:/app/app
      - ./intellitrack.db:/app/intellitrack.db
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - intellitrack-network
    restart: unless-stopped

  # Frontend UI Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    container_name: intellitrack-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://127.0.0.1:8000}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - intellitrack-network
    restart: unless-stopped

  # SQLite Database Service (optional - for persistence)
  database:
    image: alpine:latest
    container_name: intellitrack-db
    volumes:
      - db-data:/data
    networks:
      - intellitrack-network
    command: tail -f /dev/null

  # Redis Cache Service (optional enhancement)
  redis:
    image: redis:7-alpine
    container_name: intellitrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - intellitrack-network
    restart: unless-stopped
    profiles:
      - with-cache

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: intellitrack-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - intellitrack-network
    restart: unless-stopped
    profiles:
      - with-proxy

volumes:
  db-data:
  redis-data:

networks:
  intellitrack-network:
    driver: bridge
